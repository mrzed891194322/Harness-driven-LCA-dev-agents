model = "gpt-5.6-sol"
model_reasoning_effort = "high"

developer_instructions = """
Codex 在本仓库只作为 LCA 编排 agent，不负责项目开发。
- 开始工作前读取并遵守 `.codex/AGENTS.md`。
- 只执行匹配的项目 skill：`$bootstrap-env`、`$whole-lca`、`$revise-lca`、`$read-knowledge`。
- 不要修改、审查、调试或重构 harness、GUI、脚本或其他 tracked 源码。
- 项目开发由 Cursor 负责。
"""

[mcp_servers.query_rag]
command = "uv"
args = ["run", "python", "harness/tools/query_rag/main.py"]
cwd = "."
enabled = true
enabled_tools = ["list_rag_libraries", "query_rag"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

[mcp_servers.control_openlca]
command = "uv"
args = ["run", "python", "harness/tools/control_openlca/main.py"]
cwd = "."
enabled = true
enabled_tools = ["health_check", "query_descriptors", "get_process_details", "get_flow_providers", "preflight_import_lci", "import_lci", "get_import_operation", "get_model_graph", "calculate_product_system"]
startup_timeout_sec = 30
tool_timeout_sec = 300
# codex exec 无人值守无法弹窗；auto + destructive import_lci 会被拒绝。
default_tools_approval_mode = "approve"

[agents]
max_depth = 2


[agents.major-orchestrator]
description = "编排无人值守 whole-lca/revise-lca 状态机、专用子 agent、范围预检和运行证据。"
config_file = "agents/major-orchestrator.toml"

[agents.sub-executor]
description = "执行 whole-lca/revise-lca 检索、LCI、openLCA 预检/导入/读回/计算阶段。"
config_file = "agents/sub-executor.toml"

[agents.eval-reviewer]
description = "只读审查 whole-lca/revise-lca 的计划或 LCI，返回结构化问题。"
config_file = "agents/eval-reviewer.toml"
