[project]
name = "202606-harness-agent-lca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2.152",
  "deepseek-harness-sdk>=0.1.2a3",
  "google-antigravity>=0.1.16",
  "gradio>=6.19.0",
  "mcp>=2.1.1",
  "olca-ipc>=2.6.3",
  "openai-codex>=0.147.0",
  "opencode-ai>=0.1.0a36",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
openai-codex = { index = "pypi" }
deepseek-harness-sdk = { index = "pypi" }
google-antigravity = { index = "pypi" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

