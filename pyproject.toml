[project]
name = "202606-harness-agent-lca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gradio>=6.19.0",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "mcp>=2.1.1",
  "olca-ipc>=2.6.3",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
]



[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "src/GUI", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/main.py" = ["E402"]
"src/tests/**" = ["E402"]
"src/scripts/clean_dir/utils/openlca_clean.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
  "GUI",
  "ui",
  "functions",
  "scripts",
  "agent_sdk",
  "harness",
  "tests",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "harness"]
extraPaths = ["src", "src/GUI", ".", "src/scripts/proj_init", "src/scripts/gui_control", "src/scripts/clean_dir", "src/scripts/gitee_upload"]
reportMissingTypeStubs = false
