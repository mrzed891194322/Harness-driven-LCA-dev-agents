[project]
name = "202606-harness-agent-lca"
version = "0.1.0"
description = "Harness-driven LCA orchestration agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gradio>=6.19.0",
  "jsonschema>=4.26.0",
  "mcp>=2.1.1",
  "olca-ipc>=2.6.3",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/main.py" = ["E402"]
"src/tests/**" = ["E402"]
"src/scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
  "core",
  "schema",
  "services",
  "domains",
  "utils",
  "gui",
  "harness",
  "tests",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "harness"]
extraPaths = ["src", "."]
reportMissingTypeStubs = false
