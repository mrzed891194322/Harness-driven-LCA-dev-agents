id: whole-lca
max_attempts: 3

registry:
  rules:
    workspace_boundary: harness/rules/project/write-boundary.md
    runtime: harness/rules/project/runtime.md
    runtime_loop: harness/rules/project/runtime-loop.md
    paths: harness/rules/project/paths.md
    lca_method: harness/rules/lca/method.md
    knowledge_files: harness/rules/lca/knowledge-files.md
    lca_inventory: harness/rules/lca/inventory.md
    lca_mapping: harness/rules/lca/mapping.md
    lca_interpretation: harness/rules/lca/interpretation.md
    artifact_usage: harness/rules/tools/lca_artifacts.md
    openlca_usage: harness/rules/tools/control_openlca.md
    reviewer_readonly: harness/rules/project/reviewer-readonly.md
    stage_01: harness/rules/stages/01-intake-gate.md
    stage_02: harness/rules/stages/02-inventory-extraction.md
    stage_03: harness/rules/stages/03-dataset-mapping.md
    stage_04: harness/rules/stages/04-openlca-reporting.md
    assign_01_reviewer: harness/rules/assignments/01-intake-gate/reviewer.md
    assign_02_executor: harness/rules/assignments/02-inventory-extraction/executor.md
    assign_02_reviewer: harness/rules/assignments/02-inventory-extraction/reviewer.md
    assign_03_executor: harness/rules/assignments/03-dataset-mapping/executor.md
    assign_03_reviewer: harness/rules/assignments/03-dataset-mapping/reviewer.md
    assign_04_executor: harness/rules/assignments/04-openlca-reporting/executor.md
    assign_04_reviewer: harness/rules/assignments/04-openlca-reporting/reviewer.md
  tools:
    lca_artifacts:
      transport: stdio
      command: uv
      args: [run, python, harness/tools/lca_artifacts/workflow_mcp.py]
      rules: [artifact_usage]
      runtime:
        use_host_python: true
        run_context_env: true
        context_file: true
        env_prefix: LCA
    control_openlca:
      transport: stdio
      command: uv
      args: [run, python, harness/tools/control_openlca/workflow_mcp.py]
      tool_timeout_sec: 7320
      rules: [openlca_usage]
      runtime:
        use_host_python: true
        run_context_env: true
        context_file: true
        env_prefix: LCA
  knowledge:
    workspace_knowledge:
      kind: local_dir
      path: harness/knowledge/
      provider: local_files

defaults:
  rules: [workspace_boundary, runtime, runtime_loop, paths, lca_method, knowledge_files]
  knowledge: [workspace_knowledge]

stages:
  - id: 01-intake-gate
    spec: harness/specs/01-intake-gate/spec.yaml
    max_attempts: 1
    rules:
      add: [stage_01]
    steps:
      - assignment: 01-intake-gate.reviewer
  - id: 02-inventory-extraction
    spec: harness/specs/02-inventory-extraction/spec.yaml
    max_attempts: 3
    rules:
      add: [lca_inventory, stage_02]
    context:
      lca:
        phase: inventory
    steps:
      - assignment: 02-inventory-extraction.executor
      - assignment: 02-inventory-extraction.reviewer
  - id: 03-dataset-mapping
    spec: harness/specs/03-dataset-mapping/spec.yaml
    max_attempts: 3
    rules:
      add: [lca_inventory, lca_mapping, stage_03]
    context:
      lca:
        phase: mapping
    steps:
      - assignment: 03-dataset-mapping.executor
      - assignment: 03-dataset-mapping.reviewer
  - id: 04-openlca-reporting
    spec: harness/specs/04-openlca-reporting/spec.yaml
    max_attempts: 3
    rules:
      add: [lca_interpretation, stage_04]
    context:
      lca:
        phase: report
    steps:
      - assignment: 04-openlca-reporting.executor
      - assignment: 04-openlca-reporting.reviewer

assignments:
  01-intake-gate.reviewer:
    role: reviewer
    tools: []
    rules:
      add: [reviewer_readonly, assign_01_reviewer]
  02-inventory-extraction.executor:
    role: executor
    tools: [lca_artifacts]
    rules:
      add: [assign_02_executor]
  02-inventory-extraction.reviewer:
    role: reviewer
    tools: [lca_artifacts]
    rules:
      add: [reviewer_readonly, assign_02_reviewer]
  03-dataset-mapping.executor:
    role: executor
    tools: [control_openlca, lca_artifacts]
    rules:
      add: [assign_03_executor]
  03-dataset-mapping.reviewer:
    role: reviewer
    tools: [control_openlca, lca_artifacts]
    rules:
      add: [reviewer_readonly, assign_03_reviewer]
  04-openlca-reporting.executor:
    role: executor
    tools: [control_openlca, lca_artifacts]
    rules:
      add: [assign_04_executor]
  04-openlca-reporting.reviewer:
    role: reviewer
    tools: [control_openlca, lca_artifacts]
    rules:
      add: [reviewer_readonly, assign_04_reviewer]
