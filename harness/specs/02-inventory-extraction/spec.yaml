version: 2
id: 02-inventory-extraction
inputs:
- path: harness/knowledge/plan/main_plan.md
  kind: handoff
  required: true
deliverables:
- name: extracted-bom
  path: extracted-bom.json
  kind: deliverable
  format: json
  required: true
  writer: spec_mcp
  schema: deliverables/extracted-bom.schema.json
  example: examples/extracted-bom.json
- name: extracted-bom-notes
  path: extracted-bom.md
  kind: deliverable
  format: text
  required: true
  writer: spec_mcp
acceptance: acceptance.yaml
permissions: permissions.yaml
examples: examples/
lifecycle:
  on_reviewer_passed: []
handoff:
  schema: ../shared/handoff.schema.json
  checks: []
