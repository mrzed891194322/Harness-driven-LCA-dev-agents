version: 1
# 交卷后编排器执行的 Host Action 检查
host_checks: []
# submit 时 spec_mcp 执行的检查（按交付物名）
deliverables: {}
# 审查员逐条核对的要点（get_spec 返回给所有角色；reviewer 的 handoff 应逐条给出结论）
review_points:
- 研究目的、功能单位、系统边界和必做情景在计划中逐条存在且含义明确，不能只核标题是否存在。
- 每条要求按计划措辞自主分类：解释类可后续以出处表 + llm_inferred 落实，不得因计划未写“允许 LLM”而判失败。
- 只有“必须由硬工具产出、而当前无对应能力”的要求才判 failed，并写明是哪条要求、缺哪项能力。
- 计划中声明的资料文件实际存在且可读；缺少内部编号本身不是失败理由。
- 修订任务同时核对本阶段修订补充契约是否已落实。
- 审查只读：不修改输入、不查库、不生成替代计划或业务产物。
