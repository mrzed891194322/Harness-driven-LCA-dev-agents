description: |
  # 前景清单（BOM）

  从声明资料提取可追溯 BOM 及建模所需的数量依据。本阶段不查询 openLCA、不写 LCI；执行后审查，最多 3 轮。

  ## 方法

  按来源规则读取已通过的计划及本任务声明的资料；受限离线脚本可以辅助提取和换算，无法读取的资料如实记录。

  权威结构化清单为 JSON（`items` 数组）。每行含稳定 `item_id`、name、quantity、unit、process、transport（方式/距离，未知可空）、geography、source_locations、extraction_status（extracted / partial / unreadable）及可选缺口说明。未知 quantity 可为 null，extracted 行必须有数量，不新增状态枚举。

  同批 Markdown 在清单表后须提交：

  1. **需求与情景清单**：计划/修订位置、要求、必做或可选、适用情景、对应 item_id 或后续阶段交付。覆盖全部要求，不能只列已有数据的情景。
  2. **数量基准与推导**：各情景的功能单位，源数值与单位、单件/批量基准、公式及系数依据，定位到 item_id；共同公式可合并说明，不能丢失对应关系。
  3. **范围与缺口**：各环节物料、能源、水、运输、排放、废物的已覆盖项，以及未知、计划允许排除、不适用项；记录估算/代理依据、未读文件和资料冲突的处理。汇总可做的平衡与数量级核对。

  ## 验收

  - 研究范围和全部必做情景有可核查的清单覆盖；“后续交付”必须能辨认其输入依据，不能作为漏提清单的理由。
  - 数值可回链原文或有依据的推导，JSON 与 Markdown 一致，数量基准与量纲正确；已知零、未知和排除不混淆。
  - 不存在未经授权排除或无依据补齐的关键缺口；工序列名不能冒充负荷已覆盖。mapping 节点 才能决定的背景匹配留档交接，不在本阶段查库。
  - reviewer 按清单规则独立核对；缺少产物、执行失败或 blocked 不得视为完成。


  ## 交付物（本节点产出目录 `workspace/artifacts/bom/`）

  - `bom.json`：权威结构化清单，符合 `harness/specs/lca-bom/schema.json`（宿主提交后做 schema 检查，不通过直接返工）。
  - `bom.md`：同批 Markdown（清单表 + 上述三部分说明）。

  返工时保持稳定 item_id，修正指出的问题及其关联行、合计和说明，重新写完整产物。无法有据解决的关键缺口以 `status=stop` 提交。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:02-inventory-extraction:extracted-bom
  title: Extracted BOM
  type: object
  additionalProperties: false
  required:
  - items
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: true
        required:
        - item_id
        - name
        - quantity
        - unit
        - process
        - transport
        - geography
        - source_locations
        - extraction_status
        properties:
          item_id:
            type: string
            minLength: 1
          name:
            type: string
            minLength: 1
          quantity:
            type:
            - number
            - 'null'
          unit:
            type:
            - string
            - 'null'
          process:
            type:
            - string
            - 'null'
          transport:
            type:
            - object
            - 'null'
            additionalProperties: true
            properties:
              mode:
                type:
                - string
                - 'null'
              distance_km:
                type:
                - number
                - 'null'
          geography:
            type:
            - string
            - 'null'
          source_locations:
            type: array
            items:
              type: string
          extraction_status:
            type: string
            enum:
            - extracted
            - partial
            - unreadable
          gap:
            type:
            - string
            - 'null'
checks: []
