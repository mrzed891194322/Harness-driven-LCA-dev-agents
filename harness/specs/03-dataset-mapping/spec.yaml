version: 1
id: 03-dataset-mapping
inputs:
- path: workspace/outputs/inventory/extracted-bom.json
  required: true
- path: harness/knowledge/plan/main_plan.md
  required: true
outputs:
- path: workspace/outputs/inventory/process-mapping.json
  kind: file
  required: true
  format: json
  schema: harness/specs/03-dataset-mapping/process-mapping.schema.json
- path: workspace/outputs/LCI
  kind: directory
  required: true
acceptance:
  checks:
  - id: mapping
    action: mapping_check
lifecycle:
  on_reviewer_passed:
  - id: record_acceptance
    action: record_acceptance
handoff:
  schema: harness/specs/shared/lca-handoff-extension.schema.json
  checks: []
