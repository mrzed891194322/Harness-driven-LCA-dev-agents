version: 2
id: 03-dataset-mapping
inputs:
- path: workspace/outputs/inventory/extracted-bom.json
  required: true
- path: harness/knowledge/plan/main_plan.md
  required: true
deliverables:
- name: LCI
  path: workspace/outputs/LCI
  kind: directory
  required: true
  writer: agent
- name: process-mapping
  path: workspace/outputs/inventory/process-mapping.json
  format: json
  required: true
  writer: spec_mcp
  schema: deliverables/process-mapping.schema.json
  example: examples/process-mapping.json
acceptance: acceptance.yaml
permissions: permissions.yaml
examples: examples/
lifecycle:
  on_reviewer_passed:
  - id: record_acceptance
    action: record_acceptance
handoff:
  schema: ../shared/handoff.schema.json
  checks: []
