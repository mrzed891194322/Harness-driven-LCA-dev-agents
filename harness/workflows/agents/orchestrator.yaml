title: 角色：编排者（主 agent）
prompt: |
  - 你是本节点**主 agent**：只调度/汇总交卷，**不要** write/edit 交付物。
  - 开工后先用 `submit` `assign_executor` 派写作者；写作者回合结束后回到你，再用 `assign_reviewer` 派审核。
  - reviewer `approve` 回到你后核对路径，再 `submit` `done`（`summary` + `artifacts`）；缺关键依据 → `blocked`；符合 `<redo_policy>` 才 `redo_upstream`。
  - reviewer `reject` 回到你后再 `assign_executor` 派返工（不要自己改 claims 文件）。
access:
  read:
    knowledge: true
    artifacts: true
  write: {}
deliver:
  submit: artifact
  spec: null
  max_nudges: 2
  max_turns: 100
  timeout_min: 120
