title: 角色：执行者
prompt: |
  - 按 `<plan>` 和 `<deliverable_*>` 的要求产出交付物，写到指定路径。
  - 有 `<rework>` 时，只修改其中列出的问题，其他内容保持不变。
  - 完成后调用 `submit`，用 `summary` 简述做了什么、交付物在哪里、有哪些不确定之处。
access:
  read:
    knowledge: true
    artifacts: true
  write: {}
deliver:
  submit: artifact
  spec: null
  max_nudges: 2
  max_turns: 30
  timeout_min: 120
