id: lca-intake
title: 计划核对
produces:
  - {spec: lca-intake, path: intake/intake.md}
agents:
  executor: {agent: executor, rules: [rules/lca/method.yaml, rules/lca/knowledge-files.yaml]}
  reviewer: {agent: reviewer, rules: [rules/lca/method.yaml, rules/lca/knowledge-files.yaml]}
flow:
  start: executor
  max_rounds: 2
  edges:
    - {from: executor, "on": submitted, to: reviewer}
    - {from: executor, "on": checks_failed, to: executor}
    - {from: executor, "on": stop, to: failed}
    - {from: reviewer, "on": pass, to: done}
    - {from: reviewer, "on": reject, to: executor}
    - {from: reviewer, "on": stop, to: failed}
