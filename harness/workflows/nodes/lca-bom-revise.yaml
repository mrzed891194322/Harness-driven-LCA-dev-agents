id: lca-bom-revise
title: 清单修订
requires: [plan/main_plan.md, plan/revise_plan.md, previous/bom]
produces:
  - {spec: lca-bom, path: bom/bom.json}
inject: [rules/lca/method.yaml, rules/lca/knowledge-files.yaml, rules/lca/inventory.yaml, rules/lca/revise.yaml, rules/lca/revise-bom.yaml]
agents:
  executor: {role: executor}
  reviewer: {role: reviewer}
flow:
  start: executor
  max_rounds: 3
  edges:
    - {from: executor, "on": submitted, to: reviewer}
    - {from: executor, "on": checks_failed, to: executor}
    - {from: executor, "on": stop, to: failed}
    - {from: reviewer, "on": pass, to: done}
    - {from: reviewer, "on": reject, to: executor}
    - {from: reviewer, "on": stop, to: failed}
