id: whole-lca
runtime_spec: harness/specs/public/references/workflow-runtime-spec.md
max_attempts: 3

hooks:
  on_reviewer_passed:
    - lca.record_acceptance

registry:
  rules:
    workspace_boundary: harness/rules/project/write-boundary.md
    runtime: harness/rules/project/runtime.md
    paths: harness/rules/project/paths.md
    lca_method: harness/rules/lca/method.md
    knowledge_files: harness/rules/lca/knowledge-files.md
    artifact_usage: harness/rules/tools/lca_artifacts.md
    openlca_usage: harness/rules/tools/control_openlca.md
    reviewer_readonly: harness/rules/project/reviewer-readonly.md
  tools:
    lca_artifacts:
      transport: stdio
      command: uv
      args: [run, python, harness/tools/lca_artifacts/main.py]
      rules: [artifact_usage]
      runtime:
        run_context_env: true
        context_file: true
    control_openlca:
      transport: stdio
      command: uv
      args: [run, python, harness/tools/control_openlca/main.py]
      rules: [openlca_usage]
      runtime:
        run_context_env: true
        context_file: true
  knowledge:
    workspace_knowledge:
      kind: local_dir
      path: harness/knowledge/
      provider: local_files

defaults:
  rules: [workspace_boundary, runtime, paths]
  knowledge: [workspace_knowledge]

stages:
  - id: 01-intake-gate
    spec: harness/specs/01-intake-gate/README.md
    max_attempts: 1
    outputs:
      - workspace/memory/reviews/01-intake-gate-1.md
    steps:
      - assignment: 01-intake-gate.reviewer
  - id: 02-inventory-extraction
    spec: harness/specs/02-inventory-extraction/README.md
    max_attempts: 3
    outputs:
      - workspace/outputs/inventory/extracted-bom.json
      - workspace/outputs/inventory/extracted-bom.md
    checks:
      - id: lca.inventory
    steps:
      - assignment: 02-inventory-extraction.executor
      - assignment: 02-inventory-extraction.reviewer
  - id: 03-dataset-mapping
    spec: harness/specs/03-dataset-mapping/README.md
    max_attempts: 3
    outputs:
      - workspace/outputs/inventory/process-mapping.json
      - workspace/outputs/LCI/
    checks:
      - id: lca.mapping
    steps:
      - assignment: 03-dataset-mapping.executor
      - assignment: 03-dataset-mapping.reviewer
  - id: 04-openlca-reporting
    spec: harness/specs/04-openlca-reporting/README.md
    max_attempts: 3
    outputs:
      - workspace/outputs/reports/lca_report.md
    checks:
      - id: lca.report
    steps:
      - assignment: 04-openlca-reporting.executor
      - assignment: 04-openlca-reporting.reviewer

assignments:
  01-intake-gate.reviewer:
    role: reviewer
    task_spec: harness/specs/01-intake-gate/reviewer.md
    tools: []
    rules: [lca_method, knowledge_files, reviewer_readonly]
  02-inventory-extraction.executor:
    role: executor
    task_spec: harness/specs/02-inventory-extraction/executor.md
    tools: [lca_artifacts]
    rules: [lca_method, knowledge_files]
  02-inventory-extraction.reviewer:
    role: reviewer
    task_spec: harness/specs/02-inventory-extraction/reviewer.md
    tools: [lca_artifacts]
    rules: [lca_method, knowledge_files, reviewer_readonly]
  03-dataset-mapping.executor:
    role: executor
    task_spec: harness/specs/03-dataset-mapping/executor.md
    tools: [control_openlca, lca_artifacts]
    rules: [lca_method, knowledge_files]
  03-dataset-mapping.reviewer:
    role: reviewer
    task_spec: harness/specs/03-dataset-mapping/reviewer.md
    tools: [control_openlca, lca_artifacts]
    rules: [lca_method, knowledge_files, reviewer_readonly]
  04-openlca-reporting.executor:
    role: executor
    task_spec: harness/specs/04-openlca-reporting/executor.md
    tools: [control_openlca, lca_artifacts]
    rules: [lca_method, knowledge_files]
  04-openlca-reporting.reviewer:
    role: reviewer
    task_spec: harness/specs/04-openlca-reporting/reviewer.md
    tools: [control_openlca, lca_artifacts]
    rules: [lca_method, knowledge_files, reviewer_readonly]
