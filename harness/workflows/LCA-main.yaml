id: whole-lca
max_attempts: 3
global:
  permissions:
    ceiling:
    - worker-default
    - reviewer
registry: {}
defaults:
  rules:
  - write-boundary
  - runtime
  - runtime-loop
  - paths
  - lca-method
  - lca-knowledge-files
  knowledge:
  - workspace_knowledge
  - workflow_plan
  locked_rules:
  - write-boundary
  - paths
  - runtime
  - tool-control-openlca
  locked_rules_by_role:
    reviewer:
    - reviewer-readonly
plan: harness/knowledge/plan/main_plan.md
title: 完整 LCA
mode: main
stages:
- id: 01-intake-gate
  spec: 01-intake-gate
  title: 初始化检查
  short_title: 门禁
  resumable: false
  phase_title: 阶段 1 / 4：初始化检查
  max_attempts: 1
  rules:
    add:
    - stage/01-intake-gate
  steps:
  - assignment: 01-intake-gate.reviewer
- id: 02-inventory-extraction
  spec: 02-inventory-extraction
  title: 前景清单
  short_title: 清单
  resumable: true
  phase_title: 阶段 2 / 4：前景清单
  max_attempts: 3
  rules:
    add:
    - lca-inventory
    - stage/02-inventory-extraction
  context:
    lca:
      phase: inventory
  steps:
  - assignment: 02-inventory-extraction.executor
  - assignment: 02-inventory-extraction.reviewer
- id: 03-dataset-mapping
  spec: 03-dataset-mapping
  title: 数据集映射
  short_title: 映射
  resumable: true
  phase_title: 阶段 3 / 4：数据集映射
  max_attempts: 3
  rules:
    add:
    - lca-inventory
    - lca-mapping
    - stage/03-dataset-mapping
  context:
    lca:
      phase: mapping
  steps:
  - assignment: 03-dataset-mapping.executor
  - assignment: 03-dataset-mapping.reviewer
- id: 04-openlca-reporting
  spec: 04-openlca-reporting
  title: openLCA 计算与报告
  short_title: 报告
  resumable: true
  phase_title: 阶段 4 / 4：openLCA 计算与报告
  max_attempts: 3
  rules:
    add:
    - lca-interpretation
    - stage/04-openlca-reporting
  context:
    lca:
      phase: report
  steps:
  - assignment: 04-openlca-reporting.executor
  - assignment: 04-openlca-reporting.reviewer
assignments:
  01-intake-gate.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/01-intake-gate.reviewer
  02-inventory-extraction.executor:
    role: executor
    title: 执行
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - stage/02-inventory-extraction.executor
  02-inventory-extraction.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/02-inventory-extraction.reviewer
  03-dataset-mapping.executor:
    role: executor
    title: 执行
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - stage/03-dataset-mapping.executor
  03-dataset-mapping.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/03-dataset-mapping.reviewer
  04-openlca-reporting.executor:
    role: executor
    title: 执行
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - stage/04-openlca-reporting.executor
  04-openlca-reporting.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/04-openlca-reporting.reviewer
