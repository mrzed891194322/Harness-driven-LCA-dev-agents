id: revise-lca
max_attempts: 3
global:
  permissions:
    ceiling:
    - worker-default
    - reviewer
defaults:
  rules:
  - write-boundary
  - runtime
  - runtime-loop
  - paths
  - lca-method
  - lca-knowledge-files
  knowledge:
  - workspace_knowledge
  - workflow_plan
  locked_rules:
  - write-boundary
  - paths
  - runtime
  - tool-control-openlca
  locked_rules_by_role:
    reviewer:
    - reviewer-readonly
plan: harness/knowledge/plan/revise_plan.md
title: 修订 LCA
mode: revise
stages:
- id: 01-intake-gate
  spec: 01-intake-gate
  title: 初始化检查
  short_title: 门禁
  resumable: false
  phase_title: 修订阶段 1 / 4：初始化检查
  max_attempts: 1
  rules:
    add:
    - stage/01-intake-gate
    - stage/01-intake-gate.revise
  steps:
  - assignment: 01-intake-gate.reviewer
- id: 02-inventory-extraction
  spec: 02-inventory-extraction
  title: 清单修订
  short_title: 清单修订
  resumable: true
  phase_title: 修订阶段 2 / 4：清单修订
  max_attempts: 3
  rules:
    add:
    - lca-inventory
    - stage/02-inventory-extraction
    - stage/02-inventory-extraction.revise
  context:
    lca:
      phase: inventory
  steps:
  - assignment: 02-inventory-extraction.reviser
  - assignment: 02-inventory-extraction.reviewer
- id: 03-dataset-mapping
  spec: 03-dataset-mapping
  title: 映射修订
  short_title: 映射修订
  resumable: true
  phase_title: 修订阶段 3 / 4：映射修订
  max_attempts: 3
  rules:
    add:
    - lca-inventory
    - lca-mapping
    - stage/03-dataset-mapping
    - stage/03-dataset-mapping.revise
  context:
    lca:
      phase: mapping
  steps:
  - assignment: 03-dataset-mapping.reviser
  - assignment: 03-dataset-mapping.reviewer
- id: 04-openlca-reporting
  spec: 04-openlca-reporting
  title: 报告修订
  short_title: 报告修订
  resumable: true
  phase_title: 修订阶段 4 / 4：报告修订
  max_attempts: 3
  rules:
    add:
    - lca-interpretation
    - stage/04-openlca-reporting
    - stage/04-openlca-reporting.revise
  context:
    lca:
      phase: report
  steps:
  - assignment: 04-openlca-reporting.reviser
  - assignment: 04-openlca-reporting.reviewer
assignments:
  01-intake-gate.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/01-intake-gate.reviewer
  02-inventory-extraction.reviser:
    role: reviser
    title: 修订
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - stage/02-inventory-extraction.reviser
  02-inventory-extraction.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/02-inventory-extraction.reviewer
  03-dataset-mapping.reviser:
    role: reviser
    title: 修订
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - stage/03-dataset-mapping.reviser
  03-dataset-mapping.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/03-dataset-mapping.reviewer
  04-openlca-reporting.reviser:
    role: reviser
    title: 修订
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - stage/04-openlca-reporting.reviser
  04-openlca-reporting.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - reviewer-readonly
      - stage/04-openlca-reporting.reviewer
