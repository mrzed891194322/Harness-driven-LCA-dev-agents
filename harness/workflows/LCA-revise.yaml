id: revise-lca
max_attempts: 3
global:
  permissions:
    ceiling:
    - worker-default
    - reviewer
registry:
  rules:
    workspace_boundary: harness/rules/project/write-boundary.md
    runtime: harness/rules/project/runtime.md
    runtime_loop: harness/rules/project/runtime-loop.md
    paths: harness/rules/project/paths.md
    lca_method: harness/rules/lca/method.md
    knowledge_files: harness/rules/lca/knowledge-files.md
    lca_inventory: harness/rules/lca/inventory.md
    lca_mapping: harness/rules/lca/mapping.md
    lca_interpretation: harness/rules/lca/interpretation.md
    artifact_usage: harness/rules/tools/lca_artifacts.md
    openlca_usage: harness/rules/tools/control_openlca.md
    reviewer_readonly: harness/rules/project/reviewer-readonly.md
    stage_01: harness/rules/stages/01-intake-gate.md
    stage_01_revise: harness/rules/stages/01-intake-gate.revise.md
    stage_02: harness/rules/stages/02-inventory-extraction.md
    stage_02_revise: harness/rules/stages/02-inventory-extraction.revise.md
    stage_03: harness/rules/stages/03-dataset-mapping.md
    stage_03_revise: harness/rules/stages/03-dataset-mapping.revise.md
    stage_04: harness/rules/stages/04-openlca-reporting.md
    stage_04_revise: harness/rules/stages/04-openlca-reporting.revise.md
    assign_01_reviewer: harness/rules/stages/01-intake-gate.reviewer.md
    assign_02_reviser: harness/rules/stages/02-inventory-extraction.reviser.md
    assign_02_reviewer: harness/rules/stages/02-inventory-extraction.reviewer.md
    assign_03_reviser: harness/rules/stages/03-dataset-mapping.reviser.md
    assign_03_reviewer: harness/rules/stages/03-dataset-mapping.reviewer.md
    assign_04_reviser: harness/rules/stages/04-openlca-reporting.reviser.md
    assign_04_reviewer: harness/rules/stages/04-openlca-reporting.reviewer.md
  tools:
    mcp:
      lca_artifacts:
        transport: stdio
        command: uv
        args:
        - run
        - python
        - harness/tools/mcp/lca_artifacts/main.py
        rules:
        - artifact_usage
        runtime:
          use_host_python: true
          run_context_env: true
          context_file: true
          env_prefix: LCA
      control_openlca:
        transport: stdio
        command: uv
        args:
        - run
        - python
        - harness/tools/mcp/control_openlca/workflow_mcp.py
        tool_timeout_sec: 7320
        rules:
        - openlca_usage
        runtime:
          use_host_python: true
          run_context_env: true
          context_file: true
          env_prefix: LCA
    host_action:
      inventory_check:
        command: uv
        args:
        - run
        - python
        - harness/tools/host_action/lca_artifacts/main.py
        - inventory-check
        timeout_sec: 60
      mapping_check:
        command: uv
        args:
        - run
        - python
        - harness/tools/host_action/lca_artifacts/main.py
        - mapping-check
        timeout_sec: 60
      report_check:
        command: uv
        args:
        - run
        - python
        - harness/tools/host_action/lca_artifacts/main.py
        - report-check
        timeout_sec: 60
      record_acceptance:
        command: uv
        args:
        - run
        - python
        - harness/tools/host_action/lca_artifacts/main.py
        - record-acceptance
        timeout_sec: 60
  knowledge:
    workspace_knowledge:
      kind: local_dir
      path: harness/knowledge/inputs/
      provider: local_files
    workflow_plan:
      kind: local_dir
      path: harness/knowledge/plan/
      provider: local_files
  permissions:
    worker-default: harness/specs/shared/permissions/worker-default.yaml
    reviewer: harness/specs/shared/permissions/reviewer.yaml
defaults:
  rules:
  - workspace_boundary
  - runtime
  - runtime_loop
  - paths
  - lca_method
  - knowledge_files
  knowledge:
  - workspace_knowledge
  - workflow_plan
  locked_rules:
  - workspace_boundary
  - paths
  - runtime
  - openlca_usage
  locked_rules_by_role:
    reviewer:
    - reviewer_readonly
plan: harness/knowledge/plan/revise_plan.md
title: 修订 LCA
mode: revise
stages:
- id: 01-intake-gate
  spec: 01-intake-gate
  title: 初始化检查
  short_title: 初始化
  resumable: false
  phase_title: 修订阶段 1 / 4：初始化检查
  max_attempts: 1
  rules:
    add:
    - stage_01
    - stage_01_revise
  steps:
  - assignment: 01-intake-gate.reviewer
- id: 02-inventory-extraction
  spec: 02-inventory-extraction
  title: 清单修订
  short_title: 清单修订
  resumable: true
  phase_title: 修订阶段 2 / 4：清单修订
  max_attempts: 3
  rules:
    add:
    - lca_inventory
    - stage_02
    - stage_02_revise
  context:
    lca:
      phase: inventory
  steps:
  - assignment: 02-inventory-extraction.reviser
  - assignment: 02-inventory-extraction.reviewer
- id: 03-dataset-mapping
  spec: 03-dataset-mapping
  title: 映射修订
  short_title: 映射修订
  resumable: true
  phase_title: 修订阶段 3 / 4：映射修订
  max_attempts: 3
  rules:
    add:
    - lca_inventory
    - lca_mapping
    - stage_03
    - stage_03_revise
  context:
    lca:
      phase: mapping
  steps:
  - assignment: 03-dataset-mapping.reviser
  - assignment: 03-dataset-mapping.reviewer
- id: 04-openlca-reporting
  spec: 04-openlca-reporting
  title: 报告修订
  short_title: 报告修订
  resumable: true
  phase_title: 修订阶段 4 / 4：报告修订
  max_attempts: 3
  rules:
    add:
    - lca_interpretation
    - stage_04
    - stage_04_revise
  context:
    lca:
      phase: report
  steps:
  - assignment: 04-openlca-reporting.reviser
  - assignment: 04-openlca-reporting.reviewer
assignments:
  01-intake-gate.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - reviewer_readonly
      - assign_01_reviewer
  02-inventory-extraction.reviser:
    role: reviser
    title: 修订
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - assign_02_reviser
  02-inventory-extraction.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - lca_artifacts
    rules:
      add:
      - reviewer_readonly
      - assign_02_reviewer
  03-dataset-mapping.reviser:
    role: reviser
    title: 修订
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - assign_03_reviser
  03-dataset-mapping.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - reviewer_readonly
      - assign_03_reviewer
  04-openlca-reporting.reviser:
    role: reviser
    title: 修订
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - assign_04_reviser
  04-openlca-reporting.reviewer:
    role: reviewer
    title: 审查
    tools:
      mcp:
        add:
        - control_openlca
        - lca_artifacts
    rules:
      add:
      - reviewer_readonly
      - assign_04_reviewer
