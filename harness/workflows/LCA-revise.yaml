id: revise-lca
reuse: harness/workflows/LCA-main.yaml
registry:
  rules:
    user_intent: harness/rules/lca/user-intent.md
stage_overrides:
  01-intake-gate:
    spec_additions:
      - harness/specs/01-intake-gate/references/revise.md
  02-inventory-extraction:
    spec_additions:
      - harness/specs/02-inventory-extraction/references/revise.md
    steps:
      - assignment: 02-inventory-extraction.reviser
      - assignment: 02-inventory-extraction.reviewer
  03-dataset-mapping:
    spec_additions:
      - harness/specs/03-dataset-mapping/references/revise.md
    steps:
      - assignment: 03-dataset-mapping.reviser
      - assignment: 03-dataset-mapping.reviewer
  04-openlca-reporting:
    spec_additions:
      - harness/specs/04-openlca-reporting/references/revise.md
    steps:
      - assignment: 04-openlca-reporting.reviser
      - assignment: 04-openlca-reporting.reviewer
assignments:
  01-intake-gate.reviewer:
    rules:
      add: [user_intent]
  02-inventory-extraction.reviser:
    role: reviser
    task_spec: harness/specs/02-inventory-extraction/reviser.md
    tools: [lca_artifacts]
    rules:
      add: [lca_method, knowledge_files, user_intent]
  02-inventory-extraction.reviewer:
    rules:
      add: [user_intent]
  03-dataset-mapping.reviser:
    role: reviser
    task_spec: harness/specs/03-dataset-mapping/reviser.md
    tools: [control_openlca, lca_artifacts]
    rules:
      add: [lca_method, knowledge_files, user_intent]
  03-dataset-mapping.reviewer:
    rules:
      add: [user_intent]
  04-openlca-reporting.reviser:
    role: reviser
    task_spec: harness/specs/04-openlca-reporting/reviser.md
    tools: [control_openlca, lca_artifacts]
    rules:
      add: [lca_method, knowledge_files, user_intent]
  04-openlca-reporting.reviewer:
    rules:
      add: [user_intent]
