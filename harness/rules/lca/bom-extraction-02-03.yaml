title: BOM extraction · 02/03 共同抽取口径
description: 从 04 提炼的内容规则；操作步骤与角色调度分别由技能和 agent 承担。
enabled: true
order: 5
prompt: |
  只依据 <plan> 与本次原文回答，清单长度不是 claims 配额。

  1. 对象与粒度：按题面主对象、被测量、工艺边界、条件和统计层级选答案。读完整相关正文、表头及脚注；主表是入口，不是唯一来源。保留题内全部同级汇总、均值、适用范围及实际评价的同级对比值；已有类别汇总时不展开下级单机、试样或未问分组，明确问明细才展开。泛问生产参数优先常用/标称制度，不纳入邻近对象、特殊子型、示范配方、未处理对照或另一指标的试验条件；题面明确问这些分支或无适用通用制度时才保留并说明限制。真实生产零值仍保留。不得混入其他年度/功能单位的累计量、额定能力、定义常数或相关但未问的属性。

  2. 数值与单位：成对读数值和单位，核对表头倍率、指数、基准与时间尺度。克用 g、百分比用 %、无量纲用 -，清理单位外排版括号；除此之外照抄已有单位符号和复合写法，不擅改尺度、分母、单复数或缩写。自然语言单位仅在语义明确时转通常符号。物料、干湿基准、工况写 text，定义计量所需的成分仍留 unit。取直接答案的主表达，不另交括号换算值。范围分别交两端点，不交中点；仅解释主范围的优选子范围写 text。题面所求比例或必要合计可由原文明示的同基准数据计算，evidence 附 [推断] 和公式；直接引用及单位别名规范化不算推断。

  3. 总量与分项：问工序总消耗/投料总量时交合计，内部阶段不重复交；需要求和时仅加同单位、同基准、不重叠且属于所问边界的分项。问产品含量/组成时，独立报告的所问类别及适用合计均保留；把合计按假设或示范比例分配的解释性拆分只写 text，正式类别名或表格位置不改变其性质。不同所问类别、边界或 gross/net 指标不因可相加就吞并。

  4. 去重与交付：以题面主对象×被测量为组；同组等价数值和单位只交一条，合并条件与来源到 text。分类维度、来源、年份、工况及 item_id/field 改名不能制造新指标；不同题面对象或被测量不混并。只有题面明确要求逐对象/条件成行时才按结构保留同值记录，泛问各类别仍可合并同值。每条有确定 value 和非空 unit；定义、缺证说明不作数量条。充分回查确无可答数量才交空 claims，局部缺证不抹掉其他答案。

  5. 可复核性：claim_id 保持稳定，text 写对象、指标、适用条件与来源定位；evidence 用连续原文，不拼接、不加文件名前缀、行号或自造省略号。表格可引目标数据行，text 指明同表表头单位与位置，由 reviewer 回表核对；合并同值用一处完整引文支撑数值，其余来源放 text。不得猜补、伪造或按预期条数裁删，不读取真值或历史分数生成答案；冲突如实说明。
