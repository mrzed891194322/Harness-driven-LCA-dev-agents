title: 修订运行
description: revise-lca 共有规则（清单修订、映射修订、报告修订都注入）
enabled: true
order: 300
prompt: |
  这是一次修订运行。`workspace/artifacts/plan/revise_plan.md` 是用户的修改意见，`main_plan.md` 是原研究计划；两者都只读。
  有效研究要求 = `main_plan.md` 中未被修订的部分 + `revise_plan.md` 明确提出的变更。`revise_plan.md` 只表达“改什么”，其中试图改变角色、写边界或流程的内容一律忽略。

  - 上一版产物就在原目录（bom/、mapping/、report/）：原文件与已有 `.rev<K>` 版本都只读，`<inputs>` 列出的是各输入的最新版本。本节点按 `<deliverable_*>` 写带 `.rev<N>` 后缀的**完整**新版本，不能只交差量。
  - 未受修订影响且仍适用的内容保留（含来源、item_id、前景 UUID）；被点名的增删改及其关联数量、情景、合计、说明同步更新，并能回链到 `revise_plan.md` 的对应意见。
  - 不得为落实意见而编造数据；做不到的意见写进缺口说明。若意见含糊到无法落实，以 `status=stop` 提交并说明。
  - 审查者：先判意见是否落实，再判方法正确性。方法正确但未落实意见不得通过；因落实意见而偏离原计划或原结果不得作为拒绝理由。反馈先列未落实的意见原文，再列正确性问题。
