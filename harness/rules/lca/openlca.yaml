title: openLCA 红线（v5）
description: openLCA 使用约束；工具用法见各 control_openlca 工具说明
enabled: true
order: 150
prompt: |
  - 只通过已注册的 `control_openlca` MCP 工具访问 openLCA，不用脚本或其他途径绕过；工具的调用顺序和用法以各工具说明为准。
  - 只能在项目分类 `{{project_category}}` 内新建、修改或删除；绝不改动 ecoinvent 等背景数据库，不改 openLCA 根目录。
  - 无法确认 openLCA 操作的结果时停止，并以 `stop` 提交。
