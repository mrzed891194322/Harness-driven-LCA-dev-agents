title: BOM extraction 04 · 共同抽取口径
description: 04 executor 与 reviewer 共用的内容规则；角色技能只规定操作步骤。
enabled: true
order: 5
prompt: |
  只依据 <plan> 的问题和本次原文抽取数量。执行者与审核者共用以下口径；清单长度不是 claims 配额。

  1. 对象锚定：先确定题面对象、所问指标、工艺边界、条件及统计层级。每个候选必须能对回这些限定，不能因同页、同单位或同材料大类而纳入。优先定位直接回答题面的主表、规格或结论，读全表头、行列、脚注及相关正文。题面举例不等于要求展开所有牌号、产品形态、工序和试验组合。已有适用主工艺时，其他对象、备选工艺、示范配方和未处理对照组只作背景；明确要求列举、对照或比较时才交相应数值。所问对象自身的真实零值仍须保留。

  2. 粒度与覆盖：保留所问对象内的全部同级答案，包括实际年度处理量、同一功能边界下不同设备或条件的对比值、各类别的平均值，不用第一条或最大值替代。问一般参数或类别水平且作者已有相应汇总时，交这些汇总；不再展开其下每台设备、每个试样或未问分组的观测值。问逐机、逐条件明细时才展开。不同统计边界的适用汇总可同时保留并说明边界；不要混淆实耗、额定能力、背景常数与另一个指标。无需为了增加覆盖而枚举邻近数字，也不能仅因来源不同或值较小排除直接答案。

  3. 数值与单位：从同一处证据成对读取数值和单位，核对表头倍率、指数、小数点、百分比基准及时间尺度。unit 用明确的标准短符号：克用 g，无量纲用 -，百分比用 %；去掉单位外的排版括号。原文缩写只有语义明确时才规范，不凭字形猜单位。物料名称、产品形态、干湿基准和工况写入 text，不把说明短语放进 unit；定义指标所需的计量成分仍须保留，例如 kg N/ha 中的 N。数值不变时不得改变单位尺度；需换算时同步换算数值并留依据。题面允许多种单位时取直接答题的主表/规格字段表达，无主表时取正文主表达，不同时交括号换算值。原文 evidence 保持原样，单位符号规范化不算数值推断。

  4. 范围与计算：所问参数以范围给出时分别交上下端点，text 标明共同条件，不额外交中点。只解释主范围的优选子范围、示范配方放 text，除非题面问该细分。实际独立测量或年度量按所问层级保留，不自行平均。题面明确要求比例、且原文明示同基准的分子分母时允许计算，使用所求单位的通常符号；只有实际计算的答案才在 evidence 留原文依据、[推断] 及公式。不要把直接引用或单位拼写规范化误标为推断。

  5. 总量与分项：只问工艺或物料总量时用适用合计，不另交仅用于解释该合计的假设配比或内部阶段拆分。问组成、内容声明或各分项数值时，保留原文正式报告的独立类别及适用合计，不能以已有总量为由删掉题面所问分项。不同类别、统计边界、gross/net 或条件的独立指标不能仅因可相加而合并。没有现成合计而确须求和时，只相加同单位、同基准、不重叠且原文明示属于所问边界的分项，留引文和 [推断] 公式。

  6. 去重与交付：同一题面对象、同一指标下，数值与规范单位等价的答案只交一条；即使出现在不同来源、年份或条件中，也合并到该条 text，保留各自适用条件和来源定位。不同所问对象或指标不能混并；题面明确要求逐条件记录时按题面保留。范围端点与其他答案重合时同样合并覆盖。每条 claim 都必须有确定的数值 value 和非空 unit；定义、解释、缺证说明不得以空 value/unit 独立交卷。局部缺证不等于整份无答案；充分回查确无可答数量才交空 claims。

  7. 可复核性：claim_id 稳定标识条目，item_id/field 对齐题面，text 写对象、指标、全部适用条件及来源定位。evidence 用包含数值及单位/表头的连续原文摘录，保留中间行，不混入文件名前缀、行号、解释、拼接符或自加省略号；合并多处同值答案时用一处完整证据支持数值，其余来源定位和适用依据放 text。不得猜补、伪造证据、按预期条数裁删，或读取评测真值及历史分数来生成答案。来源矛盾和无法核实之处如实报告。
