title: BOM extraction 04 · 共同抽取口径
description: 04 executor 与 reviewer 共用的内容规则；角色技能只规定操作步骤。
enabled: true
order: 5
prompt: |
  只依据 <plan> 的问题和本次提供的原文，抽取可直接回答问题的数量。执行者和审核者均按以下口径判断。

  1. 范围与覆盖：先明确所问对象、指标、条件和统计口径，再通读相关正文、完整表头、行列和脚注。每个清单项可有多个独立答案；清单长度不是 claims 配额。覆盖所问的独立来源、实际处理水平、年度量、均值及零值对照，不以最大值或第一条代替全部答案。示例对象不自动展开为所有工艺组合。局部缺证不等于整份无答案；充分回查确无可答数字才交空 claims，不猜补。

  2. 数值与单位：直接引用时从同一处证据成对读取数值和单位，保留原文写法、大小写及单复数；unit 保留定义计量基准的原文必要成分，工况与来源解释放 text。不要把待抽取数值、范围端点或整句范围表达抄进 unit。核对表头倍率、指数、小数点、百分比基准和时间尺度，不借邻行、另一图轴或常识替换。题面明确要求比例、且原文明示可比的分子分母时，允许按同一基准推导该比例；使用所求单位的通常符号（如质量比 kg/kg），物料名称与干湿等基准完整写入 text，evidence 留原始分子分母及 [推断] 公式。不要把“按原文引用”误用成禁止题面明确要求的比例计算，也不要在直接引用的单位中自行删改原文成分。题面单位不授权只换单位而不换数值；来源与题面有出入而不能据实计算时说明冲突。

  3. 范围与代表值：所问参数以范围给出时，分别交原文下限和上限，text 标明端点和共同条件；不额外交中点。同一通用工艺范围内、仅说明该范围的优选子范围或示范配方，默认作为 text 的补充，不另列数值；题面明确问优选、实施例或逐配方比较时才分别交付。实际测量、年度处理量、独立实验和不同来源估计不属于这种说明性子范围，仍按其适用条件保留，不取平均。题面明确问单一代表值且作者提供该代表值时用作者值；只有题面明确要求算术中点时才计算中点并留公式。

  4. 总量与分量：按题面所问边界交付。问总量时优先用原文明示的适用总量；未明示总量时，只能相加同单位、同基准、不重叠且原文明确属于该总量的分项，evidence 保留引文及 [推断] 加数与公式。问总量不另交未问分项；问各分量不以总和替代。不同路线、阶段、gross/net 和独立统计值不能因数值可加而合并。

  5. 独立性与去重：每条必须增加独立的所问信息。共同来源条款仅因覆盖多个标签、形态或时间条件而被重复抄写时合一条，text 保留有据的全部适用条件及所覆盖清单项的完整称呼。不同来源、实际对象、试验、阶段、统计口径的独立值不能只因数值相等而合并。同一测量的主表达和括号换算仅交题面要求的原文表达；题面允许任选时取直接答题的主表/规格字段，无主表时取正文主表达，另一表达留在 text/evidence。明确要求两种表达或逐条件记录时遵从题面。

  6. 交付必要性：性能讨论的背景数字、未问指标、未问分母常数不独立交付。原文明示的可选工艺在题面要求替代、全量或比较，或它是唯一可答依据时保留；已有适用主工艺且未问替代时不另交。回读完整句段判断用途，不凭 nominal、脚注位置或数字相近删条。直接回答问题的独立适用分支仍须保留，不能为了减少条数删除。

  7. 可复核性：每条用 claim_id 标识，text 写明对象、指标、条件及来源定位，item_id/field 对齐题面。直接抽取的 evidence 只放包含数值及其单位/表头的连续原文摘录，保留中间行；不混入文件名前缀、行号、解释、拼接符或自加省略号。原文明示的数值直接引用，不因另做核验算式而标成推断；只有实际推导出的答案才在 evidence 留原文依据、[推断] 标记及必要公式。数值条须有确定的 value 与 unit，不估算、不以常识修正文献。只依据题面和原文取舍，不读取评测真值、历史分数或预期条数来生成答案。来源矛盾、无法核实和机械检查冲突须如实报告，不能伪造证据或修改标签掩盖。
