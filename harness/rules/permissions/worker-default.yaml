id: worker-default
description: 执行 / 修订角色：读 workspace 和知识库，只写 workspace；bash 保留但逐条记录（越界只标记，不拦截）
default_for_roles: [executor, reviser]
applies_to:
  roles: [executor, reviser]
tools:
  builtin: [read, bash, grep, find, ls, write, edit]
  mcp: ["mcp__lca_artifacts__*", "mcp__control_openlca__*"]
paths:
  read: ["workspace/**", "harness/knowledge/**"]
  write: ["workspace/**"]
