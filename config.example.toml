# 项目配置（替代原 .env）。复制为仓库根目录的 config.toml 后按需修改。
# 密钥不在此文件：写在 Web「设置」或 `.local/credentials/`。

[gui]
web_port = 3000
api_port = 8800
# lang = "zh"  # 面板语言，后续双语切换用

[openlca]
ipc_host = "127.0.0.1"
ipc_port = 8080
# 必须等于代码里锁定的类别
project_category = "202606-harness-agent-LCA"

[harness]
language = "中文"
# 兼容旧配置：若存在则忽略非 pi 值
# agent = "pi"

[pi]
# 旧字段。计划页默认模型在 .local/workflow-models.json，不读这一项。
model = "default"
# 模型请求失败后的重试等待（秒）；不填用代码默认 10,30,60。
# model_retry_delays_s = "10,30,60"
