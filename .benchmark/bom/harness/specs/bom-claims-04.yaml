description: |
  ## 方法（短指针）

  - executor：`harness/tools/skills/bom-claims-flow-04/SKILL.md`（读文前在 executor 中间目录写 checklist.json → 读原文 → 写 claims；04 executor 不挂 check MCP）
  - reviewer：`harness/tools/skills/bom-claims-review/SKILL.md`（**先** MCP `mcp__bom_claims_check__check_claims(checklist=…)`，再对照 knowledge 长文）

  ## 交付物

  写到 `workspace/runs/_run/artifacts/bom/claims.json`，形状可对齐 `.benchmark/schemas/claim_set.schema.json`。

  ## 验收

  - JSON 通过下方 schema；内容按两角色共同挂载的 `rules/lca/bom-extraction-04.yaml`，操作按上述技能。
  - reviewer 必须独立核对原文并处理 MCP 告警；启发式数值/覆盖告警由其据原文裁定，不作为宿主硬拒收条件。真实漏项、题外项、总分重复、空交付仍须审核修正；有据的范围端点不能为消警而删去。
  - 宿主仍强制 JSON schema、角色权限及 reviewer approve 后才能完成；缺产物、blocked、编造不得视为完成。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-best
  title: Claim set (best condition)
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    abstained:
      type: boolean
      description: 可选兼容字段；无依据时交空 claims 即可。
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          value: {type: [number, "null"]}
          unit: {type: [string, "null"]}
          evidence: {type: [string, "null"]}
        anyOf:
          - {required: [text]}
          - {required: [value, unit]}
checks: []
