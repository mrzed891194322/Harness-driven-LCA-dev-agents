description: |
  # 数量声明（claims）· 已废弃实验规格

  **废弃**：`f4ff815` unit-phrase 实验对 Nemotron `…163522` mean≈0.503 vs 对照 `…144453` Δ−0.026；
  原因=交付「原文完整单位短语」与 exact_tuple / PCFBench 规范化短符号金标冲突。
  02 已改回共享 `.benchmark/bom/harness/specs/bom-claims.yaml`（短符号）。本文件仅留档，勿再绑 node produces。

  （以下正文为原实验契约，不再使用。）

  从计划与 `harness/knowledge/inputs/` 抽取可打分的数量声明。不查询 openLCA、不做映射、不出报告。

  写到 `workspace/artifacts/bom/claims.json`，形状对齐 `.benchmark/schemas/claim_set.schema.json`：
  - `claims`：数组；建议含 `claim_id`、`item_id`、`field`、`value`、`unit`、`text`、`evidence`
  - 打分主要看规范化后的 `(value, unit)`；`unit` 必须是文档中的完整原始单位短语，不要缩短、翻译或换算
  - 有依据则填 claims；信息不足则 `abstained: true` 且 `claims: []`，不要编造

  完成后对交付路径调用 submit。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-unit-phrase
  title: Claim set (deprecated unit-phrase experiment)
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    abstained:
      type: boolean
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          value: {type: [number, "null"]}
          unit: {type: [string, "null"]}
          evidence: {type: [string, "null"]}
        anyOf:
          - {required: [text]}
          - {required: [value, unit]}
checks: []
