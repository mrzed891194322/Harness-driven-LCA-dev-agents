description: |
  ## 方法（短指针）

  - executor：`harness/tools/skills/bom-claims-flow-04/SKILL.md`（读文前写题面契约 checklist → 读原文 → 写 claims；04 executor 不挂 check MCP）
  - reviewer：`harness/tools/skills/bom-claims-review/SKILL.md`（**先** MCP `bom_claims_check` / `check_claims(checklist=…)`，再对照 knowledge 长文）

  ## 交付物

  写到 `workspace/runs/_run/artifacts/bom/claims.json`，形状可对齐 `.benchmark/schemas/claim_set.schema.json`。

  ## 验收

  - JSON 通过下方 schema；遵守上述技能与挂载的官方抽取 rule。
  - 有 reviewer 时由其独立核对；缺产物、blocked、编造不得视为完成。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-best
  title: Claim set (best condition)
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    abstained:
      type: boolean
      description: 可选兼容字段；无依据时交空 claims 即可。
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          value: {type: [number, "null"]}
          unit: {type: [string, "null"]}
          evidence: {type: [string, "null"]}
        anyOf:
          - {required: [text]}
          - {required: [value, unit]}
checks:
  - id: bom_claims_hard_warns
    load_knowledge: true
    checklist_from_run: true
