description: |
  # 数量声明（claims · 最好条件）

  从计划与 `harness/knowledge/inputs/` 抽取可打分的数量声明。不查询 openLCA、不做映射、不出报告。

  ## 方法（短指针）

  执行前先 `read` 下列技能，并按其护栏产出：
  - `harness/tools/skills/bom-claims-read/SKILL.md`（读文）
  - `harness/tools/skills/bom-claims-ops/SKILL.md`（单位 / 输出契约 / 交卷）

  ## 交付物

  写到 `workspace/artifacts/bom/claims.json`，形状对齐 `.benchmark/schemas/claim_set.schema.json`。

  ## 验收

  - JSON 通过下方 schema；遵守上述技能护栏。
  - 每条 claim 有原文依据，或明确 abstain。
  - 有 reviewer 时由其独立核对；缺产物、blocked、编造不得视为完成。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-best
  title: Claim set (best condition)
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    abstained:
      type: boolean
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          value: {type: [number, "null"]}
          unit: {type: [string, "null"]}
          evidence: {type: [string, "null"]}
        anyOf:
          - {required: [text]}
          - {required: [value, unit]}
checks: []
