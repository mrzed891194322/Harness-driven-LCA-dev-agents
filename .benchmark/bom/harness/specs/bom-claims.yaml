description: |
  写到 `workspace/runs/_run/artifacts/bom/claims.json`；打分看规范化后的 `(value, unit)`。
  单位用短符号/短规范名（见挂载的 PCFBench 官方抽取 rule）；原文为区间时用中点值。
  无文档依据则交 `claims: []`（勿编造）。
  完成后对交付路径调用 `mcp__submit__submit`。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims
  title: Claim set
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    abstained:
      type: boolean
      description: >-
        可选；宿主/导入兼容字段。无依据时只交空 claims 即可，不必设 abstained（打分不看此字段）。
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          value: {type: [number, "null"]}
          unit: {type: [string, "null"]}
          evidence: {type: [string, "null"]}
        anyOf:
          - {required: [text]}
          - {required: [value, unit]}
checks: []
