description: |
  写到 `workspace/artifacts/bom/claims.json`，完成后对交付路径调用 submit。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-01
  title: Claim set (PCFBench 01)
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [value, unit]
        properties:
          value: {type: number}
          unit:
            type: string
            description: >-
              Just the unit symbol or short canonical form (e.g. '%', 'h', 'kg/kg', 'MJ/kg', 'mass%').
              Do NOT include descriptive prose, qualifiers, or context — those belong in surrounding
              metadata, not in the unit field.
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          evidence: {type: string}
checks: []
