description: |
  # 数量声明（claims）· bom-extract-02

  与 `bom-claims.yaml` **同 schema**；仅 02 挂载。01/03 仍用 `bom-claims.yaml`。
  `checks: []`（无宿主闸）。薄 MCP `bom_claims_check` 只告警。

  从计划与 `harness/knowledge/inputs/` 抽取数量声明。不查询 openLCA、不做映射、不出报告。

  写到 `workspace/artifacts/bom/claims.json`，形状对齐 `.benchmark/schemas/claim_set.schema.json`：
  - `claims`：数组；建议含 `claim_id`、`item_id`、`field`、`value`、`unit`、`text`、`evidence`
  - 打分主要看规范化后的 `(value, unit)`；`unit` 照抄原文单位短语（含限定语，如 N、glass、of dissolved tin）；评分器按同义表规范化，勿为对齐表而缩短或换算；原文引文保留在 `evidence`
  - 有依据则填 claims；信息不足则 `abstained: true` 且 `claims: []`，不要编造

  完成后对交付路径调用 submit。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-02
  title: Claim set (02)
  type: object
  additionalProperties: false
  required: [claims]
  properties:
    abstained:
      type: boolean
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id: {type: string, minLength: 1}
          text: {type: string}
          item_id: {type: string}
          field: {type: string}
          value: {type: [number, "null"]}
          unit: {type: [string, "null"]}
          evidence: {type: [string, "null"]}
        anyOf:
          - {required: [text]}
          - {required: [value, unit]}
checks: []
