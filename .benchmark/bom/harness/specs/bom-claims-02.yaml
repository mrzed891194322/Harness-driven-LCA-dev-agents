description: |-
  写到 workspace/runs/_run/artifacts/bom/claims.json；内容按两角色共用的 bom-extraction-02-03 规则。无依据时交 claims: []。
  执行与审核分别按 bom-claims-flow-02、bom-claims-review-02；checklist 放 executor 中间目录，不设宿主 checklist/语义告警硬闸。
  executor 写文件，reviewer 交 verdict，orchestrator 在最新 approve 后交卷；角色权限与审核门禁沿用现有 LangGraph。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:bom-claims-02
  title: Claim set (02)
  type: object
  additionalProperties: false
  required:
  - claims
  properties:
    abstained:
      type: boolean
      description: 可选兼容字段；无依据时交空 claims 即可。
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          claim_id:
            type: string
            minLength: 1
          text:
            type: string
          item_id:
            type: string
          field:
            type: string
          value:
            type:
            - number
            - 'null'
          unit:
            type:
            - string
            - 'null'
          evidence:
            type:
            - string
            - 'null'
        anyOf:
        - required:
          - text
        - required:
          - value
          - unit
checks: []
