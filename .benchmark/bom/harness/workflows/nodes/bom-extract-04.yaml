id: bom-extract-04
title: 数量声明抽取（04 · 技能+三件套）
produces:
  - {spec: .benchmark/bom/harness/specs/bom-claims-best.yaml, path: bom/claims.json}
inject:
  - rules/delivery/status.yaml
  - rules/delivery/provenance.yaml
  - rules/lca/knowledge-files.yaml
agents:
  orchestrator:
    agent: .benchmark/bom/harness/workflows/agents/bom-extract-orchestrator-04.yaml
  executor:
    agent: .benchmark/bom/harness/workflows/agents/bom-extract-executor-04.yaml
    tools:
      skills: [bom-claims-flow]
    rules:
      - rules/delivery/read-skills-first.yaml
      - rules/lca/pcfbench-extraction-official.yaml
  reviewer:
    agent: .benchmark/bom/harness/workflows/agents/bom-extract-reviewer-04.yaml
    tools:
      skills: [bom-claims-review]
      mcp: [bom_claims_check]
    rules:
      - rules/delivery/read-skills-first.yaml
