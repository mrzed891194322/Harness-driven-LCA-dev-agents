# 缓存布局。目录不进 git，也不使用 Git LFS。
# 默认根：仓库内 .cache/benchmark；允许 .cache/ 子树或仓外；其它仓内路径拒绝。

env: BENCHMARK_CACHE
default: .cache/benchmark
path_template: "{BENCHMARK_CACHE}/pcfbench/{sha_dir}/{filename}"
sha_dir_when_known: "{sha256}"
sha_dir_when_unknown: unverified

rules:
  - 默认写到 .cache/benchmark；也可用 BENCHMARK_CACHE 或 download_pcfbench.py 的 --cache-root。
  - 允许仓库外路径，或仓库内且落在 .cache/ 下；禁止其它仓内路径（尤其 .benchmark/）。
  - sha256 为空时落到 unverified/；--write-sha 算出摘要后改写 manifests 里的 sha256 字段，并把文件移到 {sha256}/。
  - 除了这条 sha256 回写，脚本不得改仓库里的其他文件。
  - 禁止把 task*.jsonl、ecoinvent_picklist.jsonl 或 PDF 拷回仓库。

ignored_filenames:
  - task1_decomposition.jsonl
  - task2_triage.jsonl
  - task3_mapping.jsonl
  - task4_extraction_material.jsonl
  - task5_extraction_energy.jsonl
  - task7_epd.jsonl
  - ecoinvent_picklist.jsonl

pdf_note: >
  评测知识用 jsonl document_text（import→input/reference.md）。可选按 source_url
  下载原 PDF 到 {BENCHMARK_CACHE}/pcfbench/source_pdfs/by_url/<url_sha256>.pdf
  （download_pcfbench.py --source-pdfs）供人工核对；失败见 failures.jsonl。
  PDF 非评测输入、不进 agent knowledge。gitignore 仍挡 .benchmark/**/*.pdf。

source_pdfs:
  path_template: "{BENCHMARK_CACHE}/pcfbench/source_pdfs/by_url/{url_sha256}.pdf"
  meta_template: "{BENCHMARK_CACHE}/pcfbench/source_pdfs/by_url/{url_sha256}.meta.json"
  failures: "{BENCHMARK_CACHE}/pcfbench/source_pdfs/failures.jsonl"
  index: "{BENCHMARK_CACHE}/pcfbench/source_pdfs/index.jsonl"
