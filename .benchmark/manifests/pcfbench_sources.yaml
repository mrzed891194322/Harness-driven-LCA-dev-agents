# PCFBench 源文件指针。这里没有文件正文。
# sha256 先留空；在仓库外跑 download_pcfbench.py --write-sha 才会回填。
# 许可：Hugging Face 数据集 Watershed-Climate/PCFBench，CC BY-NC-SA 4.0（非商业）。

dataset: Watershed-Climate/PCFBench
huggingface: https://huggingface.co/datasets/Watershed-Climate/PCFBench
license: CC-BY-NC-SA-4.0
cache_env: BENCHMARK_CACHE
cache_path: "{BENCHMARK_CACHE}/pcfbench/{sha256|unverified}/{filename}"

files:
  - filename: task1_decomposition.jsonl
    task: task1
    rows: 94
    source: huggingface
    url: https://huggingface.co/datasets/Watershed-Climate/PCFBench/resolve/main/task1_decomposition.jsonl?download=true
    sha256: "" # placeholder; --write-sha fills this

  - filename: task3_mapping.jsonl
    task: task3
    rows: 109
    source: huggingface
    url: https://huggingface.co/datasets/Watershed-Climate/PCFBench/resolve/main/task3_mapping.jsonl?download=true
    sha256: "" # placeholder; --write-sha fills this

