description: |
  写到 `workspace/artifacts/mapping/mapping.json`。每条 `items[]` 的 `process_name` 须为题面 ecoinvent 列表中的 exact string，完成后 submit。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:lci-mapping-01
  title: Closed-set mapping deliverable (01 thin)
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [process_name]
        properties:
          item_id: {type: string, minLength: 1}
          process_name: {type: string, minLength: 1}
checks: []
