description: |
  # 封闭候选集映射（PCFBench task3 · 01 真薄）

  只根据题面物料与**封闭候选名单**选一个过程名，写 `workspace/artifacts/mapping/mapping.json`。
  不查 openLCA、不依赖 BOM。每条 `items[]` 填 `item_id` 与所选 `process_name`（及 schema 要求字段）；
  禁止编造集合外名字。完成后 submit。
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:harness:spec:lci-mapping-01
  title: Closed-set mapping deliverable (01 thin)
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - item_id
          - flow_name
          - flow_id
          - process_name
          - process_id
          - provider_name
          - provider_id
          - geography_requested
          - geography_selected
          - selection_reason
          - candidates
        properties:
          item_id: {type: string, minLength: 1}
          flow_name: {type: ["string", "null"]}
          flow_id: {type: ["string", "null"]}
          process_name: {type: ["string", "null"]}
          process_id: {type: ["string", "null"]}
          provider_name: {type: ["string", "null"]}
          provider_id: {type: ["string", "null"]}
          geography_requested: {type: ["string", "null"]}
          geography_selected: {type: ["string", "null"]}
          selection_reason: {type: string, minLength: 1}
          candidates:
            type: array
            items: {type: string}
checks: []
