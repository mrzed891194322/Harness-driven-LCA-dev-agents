description: |
  # 映射分流（PCFBench task2 · 01 真薄）

  判定题面市场节点应 **直接映射**（`should_map: true`）还是 **继续分解**（`should_map: false`）。
  不查 openLCA、不建 LCI。写出 `workspace/artifacts/triage/triage.json`
  （必有 `should_map`、`rationale`；可选 `confidence`、`candidate_name`）。完成后 submit。
